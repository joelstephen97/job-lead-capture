<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lead Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="row row--space">
      <div class="brand">
        <img class="brandLogo" src="assets/leadingleads-logo.svg" alt="" />
        <div>
          <div class="title">LeadingLeads</div>
          <div class="subtitle">Capture leads locally while you browse</div>
        </div>
      </div>
      <a class="link" href="options.html" target="_blank" rel="noreferrer">Options</a>
    </header>

    <section class="card">
      <div class="row row--space">
        <button id="scanBtn" class="btn btn--primary">Scan this page</button>
        <button id="refreshBtn" class="btn btn--secondary btn--sm">Refresh</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section class="card">
      <div class="row row--space">
        <div class="sectionTitle">Captured Leads</div>
        <div class="pill"><span id="leadCount">0</span></div>
      </div>

      <div class="btnGroup">
        <button id="openLeadsBtn" class="btn btn--secondary">View All</button>
        <button id="gmailBtn" class="btn btn--primary">Open in Gmail</button>
      </div>

      <div class="btnGroup">
        <button id="copyBccBtn" class="btn btn--secondary btn--sm">Copy BCC</button>
        <button id="exportCsvBtn" class="btn btn--secondary btn--sm">Export CSV</button>
        <button id="clearBtn" class="btn btn--danger btn--sm">Clear All</button>
      </div>

      <label class="checkbox">
        <input id="clearAfterGmail" type="checkbox" />
        Clear leads after opening Gmail
      </label>

      <div class="divider"></div>

      <div id="leadList" class="leadList"></div>
    </section>

    <section class="card">
      <div class="sectionTitle">Add Manually</div>
      <div class="grid">
        <input id="manualCompany" class="input" placeholder="Company (optional)" />
        <input id="manualEmail" class="input" placeholder="Email address" />
      </div>
      <button id="manualAddBtn" class="btn btn--primary btn--full">Add Lead</button>
      
      <div class="divider"></div>
      
      <div class="hint">Paste text containing emails to extract them automatically.</div>
      <textarea id="manualText" class="textarea" placeholder="Paste text with emails here…"></textarea>
      <div class="btnGroup">
        <button id="extractEmailsBtn" class="btn btn--primary">Extract Emails</button>
        <button id="clearTextBtn" class="btn btn--secondary btn--sm">Clear</button>
      </div>
      <div id="extractStatus" class="status"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
