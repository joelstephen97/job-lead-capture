<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lead Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="row row--space">
      <div class="brand">
        <img class="brandLogo" src="assets/leadingleads-logo.svg" alt="" />
        <div>
          <div class="title">LeadingLeads</div>
          <div class="subtitle">Capture leads locally while you browse</div>
        </div>
      </div>
      <a class="link" href="options.html" target="_blank" rel="noreferrer">Options</a>
    </header>

    <section class="card">
      <div class="row row--space">
        <button id="scanBtn" class="btn btn--primary">Scan this page</button>
        <button id="refreshBtn" class="btn">Refresh</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section class="card">
      <div class="row row--space">
        <div class="sectionTitle">Leads</div>
        <div class="pill"><span id="leadCount">0</span></div>
      </div>

      <div class="row row--start row--gap">
        <button id="openLeadsBtn" class="btn">Open Leads</button>
        <button id="copyBccBtn" class="btn">Copy BCC</button>
        <button id="gmailBtn" class="btn btn--primary">Move to Gmail BCC</button>
      </div>

      <label class="checkbox">
        <input id="clearAfterGmail" type="checkbox" />
        Clear stored leads after opening Gmail
      </label>

      <div class="row row--start row--gap">
        <button id="exportCsvBtn" class="btn">Export CSV</button>
        <button id="clearBtn" class="btn btn--danger">Clear</button>
      </div>

      <div class="divider"></div>

      <div id="leadList" class="leadList"></div>
    </section>

    <section class="card">
      <div class="sectionTitle">Manual add</div>
      <div class="grid">
        <input id="manualCompany" class="input" placeholder="Company (optional)" />
        <input id="manualEmail" class="input" placeholder="Email (required)" />
      </div>
      <button id="manualAddBtn" class="btn btn--primary btn--full">Add lead</button>
      <div class="hint">Tip: you can also paste text with emails and click “Extract emails” below.</div>
      <textarea id="manualText" class="textarea" placeholder="Paste any text here…"></textarea>
      <div class="row row--space row--gap">
        <button id="extractEmailsBtn" class="btn">Extract emails</button>
        <button id="clearTextBtn" class="btn">Clear text</button>
      </div>
      <div id="extractStatus" class="status"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
